    <path d="M38 250v-88m0 47-13-18m13 5 20-22"/><path d="M423 252v-81m0 33-14-14m14-3 19-21"/>
  </g>
  <g fill="#addb81"><circle cx="35" cy="171" r="27"/><circle cx="19" cy="196" r="18"/><circle cx="61" cy="191" r="24"/><circle cx="417" cy="167" r="26"/><circle cx="444" cy="188" r="19"/><circle cx="399" cy="196" r="22"/></g>
  <g fill="#8bc769"><circle cx="21" cy="183" r="19"/><circle cx="57" cy="181" r="17"/><circle cx="436" cy="174" r="18"/><circle cx="400" cy="178" r="17"/></g>
