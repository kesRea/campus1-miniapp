  <g fill="#78bd5f"><circle cx="82" cy="250" r="13"/><circle cx="94" cy="256" r="9"/><circle cx="302" cy="252" r="11"/><circle cx="324" cy="252" r="15"/><circle cx="373" cy="254" r="12"/><circle cx="390" cy="258" r="8"/></g>
  <path d="M24 262q202 3 412 0" fill="none" stroke="#5aa55d" stroke-width="4" stroke-linecap="round"/>
