    <rect x="150" y="118" width="25" height="28" fill="url(#glass)"/><path d="M162 118v28"/>
    <rect x="206" y="111" width="25" height="28" fill="url(#glass)"/><path d="M218 111v28"/>
    <rect x="262" y="104" width="25" height="28" fill="url(#glass)"/><path d="M274 104v28"/>
    <rect x="94" y="170" width="25" height="29" fill="url(#glass)"/><path d="M106 170v29"/>
    <rect x="150" y="163" width="25" height="29" fill="url(#glass)"/><path d="M162 163v29"/>
    <rect x="206" y="156" width="25" height="29" fill="url(#glass)"/><path d="M218 156v29"/>
    <rect x="262" y="149" width="25" height="29" fill="url(#glass)"/><path d="M274 149v29"/>
    <rect x="94" y="215" width="25" height="26" fill="url(#glass)"/><path d="M106 215v26"/>
    <rect x="150" y="208" width="25" height="33" fill="url(#glass)"/><path d="M162 208v33"/>
    <rect x="206" y="201" width="25" height="40" fill="url(#glass)"/><path d="M218 201v40"/>
    <rect x="262" y="194" width="25" height="47" fill="url(#glass)"/><path d="M274 194v47"/>
