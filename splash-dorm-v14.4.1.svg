<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 292" role="img" aria-labelledby="title description">
  <title id="title">Campus №1</title>
  <desc id="description">Иллюстрация общежития с окнами, деревьями и центральным входом</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f9fcff"/><stop offset="1" stop-color="#d7e2f1"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#94aac7"/><stop offset="1" stop-color="#6d86ad"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#c9edff"/><stop offset=".57" stop-color="#67b8f7"/><stop offset="1" stop-color="#3487cc"/></linearGradient>
  </defs>
  <!-- soft backdrop -->
  <circle cx="228" cy="119" r="111" fill="#e7f3ff"/>
  <path d="M39 137c-22-8-24-40 4-46 10-29 49-32 64-5 22-3 38 17 31 37-2 7-6 12-12 14" fill="#f5f9ff"/>
  <path d="M342 123c-13-20-4-42 17-48 11-33 53-34 66-8 19-6 33 4 35 23" fill="#f5f9ff"/>
  <!-- back trees -->
