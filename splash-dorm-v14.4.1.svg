  <path d="M189 187h60v57h-60z" fill="#a8bcd0" stroke="#153a61" stroke-width="3"/>
  <path d="M199 189h40v55h-40z" fill="url(#glass)" stroke="#143a61" stroke-width="3"/>
  <path d="M219 190v54" stroke="#143a61" stroke-width="3"/>
