  <path d="M312 74 381 94v149h-69z" fill="url(#side)" stroke="#13395f" stroke-width="3" stroke-linejoin="round"/>
  <!-- main wing -->
  <path d="M74 106 312 74v170H74z" fill="url(#wall)" stroke="#13395f" stroke-width="3" stroke-linejoin="round"/>
  <path d="M68 100 312 65l72 22v11l-72-21-244 35z" fill="#d2deec" stroke="#13395f" stroke-width="3" stroke-linejoin="round"/>
