<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5F8FD">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Campus №1 — База данных</title>
  <meta name="description" content="Campus №1 — система управления общежитием">
  <!-- CAMPUS_GITHUB_UI_V13_9_TASKS_SPECIAL -->
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="styles.css?v=13.9.1">
  <link rel="stylesheet" href="tasks.css?v=13.9.1">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-card">
      <div class="splash-logo-wrap">
        <img class="brand-logo" src="logo.png" alt="Campus №1">
      </div>
      <div class="splash-kicker">Toraighyrov University</div>
      <h1>База данных Campus №1</h1>
      <p id="splashText">Подключаем Telegram и загружаем данные…</p>
      <button id="openStateBtn" class="btn btn-primary btn-wide" type="button">Подключение…</button>
      <div class="splash-note">Безопасный вход через Telegram</div>
    </div>
  </div>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div class="brand-row">
        <button id="homeLogoBtn" class="brand-button" type="button" aria-label="На главную">
          <img src="logo.png" alt="Campus №1">
        </button>
        <div class="brand-copy">
          <span>Campus №1</span>
          <small>База данных</small>
        </div>
        <div class="top-actions">
          <button id="specialBtn" class="icon-button hidden" type="button" aria-label="Управление" title="Специальная панель"><span data-icon="shield"></span></button>
          <button id="themeBtn" class="icon-button" type="button" aria-label="Переключить тему"></button>
          <button id="updatesBtn" class="icon-button updates-button" type="button" aria-label="Что нового">
            <span data-icon="spark"></span>
            <span id="updatesDot" class="updates-dot" aria-hidden="true"></span>
          </button>
          <button id="profileBtn" class="profile-button" type="button" aria-label="Профиль">
            <span id="profileInitials">C1</span>
          </button>
        </div>
      </div>
    </header>

    <section id="view" class="content" aria-live="polite"></section>
  </main>

  <nav id="bottomNav" class="bottom-nav hidden" aria-label="Основная навигация">
    <button class="nav-item active" data-page="home" type="button"><span class="nav-icon" data-icon="home"></span><span>Главная</span></button>
    <button class="nav-item" data-page="students" type="button"><span class="nav-icon" data-icon="users"></span><span>Студенты</span></button>
    <button class="nav-item" data-page="rooms" type="button"><span class="nav-icon" data-icon="grid"></span><span>Комнаты</span></button>
    <button class="nav-item" data-page="tasks" type="button"><span class="nav-icon" data-icon="clipboard"></span><span>Задачи</span></button>
    <button class="nav-item" data-page="more" type="button"><span class="nav-icon" data-icon="menu"></span><span>Ещё</span></button>
  </nav>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div id="modalSheet" class="sheet"></div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="tasks.js?v=13.9.1"></script>
  <script src="special.js?v=13.9.1"></script>
  <script src="app.js?v=13.9.1"></script>
</body>
</html>
