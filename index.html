<!DOCTYPE html>
<html lang="ru">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F6F9FE">
  <title>Campus №1 — База данных</title>
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="splash" class="splash">
    <div class="splash-card">
      <img class="brand-logo" src="logo.png" alt="Campus №1">
      <h1>База данных</h1>
      <p>Система управления общежитием Toraighyrov University</p>
      <button id="openStateBtn" class="primary" style="width:100%;margin-top:14px">Подключение к Telegram…</button>
    </div>
  </div>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div class="toprow">
        <img class="mini-logo" src="logo.png" alt="Campus №1">
        <div class="title-wrap"><div class="eyebrow">Toraighyrov University</div><div class="app-title">Campus №1 · База данных</div></div>
        <div id="userPill" class="user-pill">Пользователь</div>
      </div>
    </header>
    <section id="view" class="content"></section>
  </main>

  <nav id="bottomNav" class="bottom hidden">
    <button class="nav active" data-page="home"><i>⌂</i>Главная</button>
    <button class="nav" data-page="students"><i>♙</i>Студенты</button>
    <button class="nav" data-page="rooms"><i>▦</i>Комнаты</button>
    <button class="nav" data-page="ai"><i>✦</i>ИИ</button>
    <button class="nav" data-page="more"><i>☰</i>Ещё</button>
  </nav>

  <div id="modal" class="modal hidden"><div id="modalSheet" class="sheet"></div></div>
  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
