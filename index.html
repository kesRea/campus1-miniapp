<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F5F8FD">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Campus №1 — База данных</title>
  <meta name="description" content="Campus №1 — система управления общежитием">
  <!-- CAMPUS_GITHUB_UI_V14_2_1_EXACT_LOGO_GEOMETRY -->
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
  <link rel="stylesheet" href="styles.css?v=14.3.2">
  <link rel="stylesheet" href="tasks.css?v=14.2.0">
  <link rel="stylesheet" href="management.css?v=14.2.0">
  <link rel="stylesheet" href="splash-v14.4.1.css?v=14.4.1">
</head>
<body>
  <div id="splash" class="splash splash-v144">
    <div class="splash-card splash-card-clean">
      <div id="splashLogoHolder" class="splash-logo-holder" aria-hidden="true"></div>
      <h1 class="splash-campus-title">Campus №1</h1>
      <p class="splash-campus-subtitle">База данных общежития</p>
      <div class="splash-dorm-scene" aria-hidden="true">
        <img class="splash-dorm-art" src="splash-dorm-v14.4.1.svg" alt="" width="460" height="292" decoding="async">
      </div>
      <p id="splashText" class="splash-login-prompt">Войдите через Telegram</p>
      <button id="openStateBtn" class="btn btn-primary btn-wide splash-btn" type="button">
        <span class="splash-button-icon" aria-hidden="true"><svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M21 3 2.3 10.8c-1.3.5-1.2 1.3-.2 1.6l4.8 1.5 1.8 5.3c.2.5.4.7.7.7s.5-.1.8-.4l2.5-2.5 5.1 3.8c.9.5 1.6.2 1.8-.9L23 4.6c.3-1.3-.5-1.9-2-1.6ZM8 13.5l10.5-7.1c.5-.3 1 .1.6.5l-8.7 8.4-.4 3-2-4.8Z"/></svg></span>
        <span class="splash-button-text-v142">Войти</span>
      </button>
      <div class="splash-note">Доступ для студенческого совета.</div>
      <div class="splash-release"><span>Campus №1</span><span id="splashVersion">Версия 14.4.1</span></div>
    </div>
  </div>

  <main id="app" class="app hidden">
    <header class="topbar">
      <div class="brand-row">
        <button id="homeLogoBtn" class="brand-button brand-button-v142" type="button" aria-label="На главную">

          <span class="campus-mini-mark-v143" aria-hidden="true">
            <svg class="campus-mini-svg-v143" viewBox="0 0 80 72">
              <path d="M12 35 L40 18 L68 35"/>
              <rect x="31" y="32" width="7" height="20" rx="1"/>
              <rect x="42" y="32" width="7" height="20" rx="1"/>
            </svg>
          </span>
        </button>
        <div class="brand-copy">
          <span>Campus №1</span>
          <small>База данных</small>
        </div>
        <div class="top-actions">
          <button id="specialBtn" class="icon-button hidden" type="button" aria-label="Управление" title="Специальная панель"><span data-icon="shield"></span></button>
          <button id="themeBtn" class="icon-button" type="button" aria-label="Переключить тему"></button>
          <button id="seasonBtn" class="icon-button season-owner-button hidden" type="button" aria-label="Сменить сезон" title="Сезон">
            <span id="seasonBtnGlyph" class="season-btn-glyph">🍂</span>
          </button>
          <button id="updatesBtn" class="icon-button updates-button" type="button" aria-label="Что нового">
            <span data-icon="spark"></span>
            <span id="updatesDot" class="updates-dot" aria-hidden="true"></span>
          </button>
          <button id="profileBtn" class="profile-button" type="button" aria-label="Профиль">
            <span id="profileInitials">C1</span>
          </button>
        </div>
      </div>
    </header>

    <section id="view" class="content" aria-live="polite"></section>
  </main>

  <nav id="bottomNav" class="bottom-nav hidden" aria-label="Основная навигация">
    <button class="nav-item active" data-page="home" type="button"><span class="nav-icon" data-icon="home"></span><span>Главная</span></button>
    <button class="nav-item" data-page="students" type="button"><span class="nav-icon" data-icon="users"></span><span>Студенты</span></button>
    <button class="nav-item" data-page="rooms" type="button"><span class="nav-icon" data-icon="grid"></span><span>Комнаты</span></button>
    <button class="nav-item" data-page="tasks" type="button"><span class="nav-icon" data-icon="clipboard"></span><span>Задачи</span></button>
    <button class="nav-item" data-page="more" type="button"><span class="nav-icon" data-icon="menu"></span><span>Ещё</span></button>
  </nav>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-backdrop" data-close-modal></div>
    <div id="modalSheet" class="sheet"></div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="tasks.js?v=14.2.0"></script>
  <script src="special.js?v=14.2.0"></script>
  <script src="management.js?v=14.2.0"></script>
  <script src="app.js?v=14.4.1"></script>
</body>
</html>
