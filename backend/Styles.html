<style>
/* CAMPUS_UI_V8_POLISHED */

  --text:#f2f6fd;--text-2:#d6deea;--muted:#8f9db1;--border:#243247;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overscroll-behavior-y:none}
body{min-height:100vh;transition:background .2s ease,color .2s ease}
button,input,select,textarea{font:inherit;color:inherit}button{touch-action:manipulation} button,.row-card,.room,.metric,.quick-card,.more-item,.smart-search{transition:transform .12s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease} button:active,.row-card:active,.room:active,.metric:active,.quick-card:active,.more-item:active,.smart-search:active{transform:scale(.985)}

/* Splash */

.splash-card{width:min(420px,100%);text-align:center}.brand-logo{width:220px;max-width:72%;height:auto;margin:0 auto 20px;display:block;filter:drop-shadow(0 12px 26px rgba(36,104,196,.08))}

.primary{border:0;background:linear-gradient(135deg,var(--blue-2),var(--blue));color:#fff;border-radius:16px;padding:14px 18px;font-weight:800;box-shadow:0 10px 25px rgba(22,119,242,.22);cursor:pointer;transition:transform .12s ease,filter .12s ease}.primary:active{transform:scale(.985)}.primary:disabled{opacity:.65;cursor:default}
.secondary{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:14px;padding:11px 14px;font-weight:750;cursor:pointer;transition:background .15s ease,transform .12s ease}.secondary:active{transform:scale(.985);background:var(--surface-2)}
.danger{background:var(--red-soft);color:var(--red);border-color:color-mix(in srgb,var(--red) 24%,var(--border))}

/* Header */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:10px 16px 8px;border-bottom:1px solid color-mix(in srgb,var(--border) 70%,transparent)}
.toprow{display:flex;align-items:center;gap:10px}.mini-logo{width:40px;height:40px;object-fit:contain;border-radius:10px;background:#fff}.title-wrap{min-width:0;flex:1}.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--blue);font-weight:900}.app-title{font-size:17px;font-weight:900;line-height:1.12;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.user-pill{display:none}
.theme-quick{width:40px;height:40px;border-radius:13px;border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;color:var(--text-2);padding:0;box-shadow:0 5px 16px rgba(15,50,90,.05)}
.theme-quick svg{width:19px;height:19px}
.content{padding:14px 16px 30px;animation:pageIn .18s ease}@keyframes pageIn{from{opacity:.35;transform:translateY(3px)}to{opacity:1;transform:none}}

/* Home */
.welcome-panel{position:relative;overflow:visible;border:0;background:transparent;border-radius:0;padding:10px 2px 4px;box-shadow:none}
.welcome-panel:before{display:none}
.welcome-top{display:flex;align-items:center;gap:14px;position:relative;z-index:1}.profile-avatar{width:54px;height:54px;border-radius:18px;background:linear-gradient(145deg,var(--blue),var(--cyan));color:#fff;display:grid;place-items:center;font-size:19px;font-weight:900;overflow:hidden;box-shadow:0 12px 24px rgba(22,119,242,.20);flex:0 0 auto}.profile-avatar img{width:100%;height:100%;object-fit:cover}.welcome-copy{min-width:0;flex:1}.welcome-kicker{font-size:12px;color:var(--muted);font-weight:700}.welcome-name{font-size:25px;line-height:1.08;letter-spacing:-.035em;font-weight:900;margin:3px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.role-line{display:flex;align-items:center;gap:7px;color:var(--text-2);font-size:12px}.role-badge{display:inline-flex;align-items:center;border-radius:999px;padding:5px 9px;background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:11px}
.occupancy{margin-top:16px;position:relative;z-index:1;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:12px 13px;box-shadow:0 6px 20px rgba(20,66,130,.035)}.occupancy-head{display:flex;justify-content:space-between;gap:10px;font-size:11px;color:var(--muted);font-weight:700}.progress{height:7px;background:var(--surface-3);border-radius:999px;margin-top:8px;overflow:hidden}.progress>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--blue-2),var(--cyan))}
.smart-search{margin-top:13px;display:flex;align-items:center;gap:11px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:13px 14px;box-shadow:var(--shadow);cursor:pointer}.smart-search .search-icon{width:36px;height:36px;border-radius:12px;background:var(--blue-soft);display:grid;place-items:center;color:var(--blue);flex:0 0 auto}.smart-search svg{width:18px;height:18px}.smart-search strong{display:block;font-size:13px}.smart-search small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.smart-search .chev{margin-left:auto;color:var(--muted)}
.section-title{font-size:16px;font-weight:900;margin:22px 2px 11px;letter-spacing:-.015em}.section-sub{font-size:11px;color:var(--muted);margin:-7px 2px 11px}
.metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px;box-shadow:0 8px 22px rgba(20,66,130,.045);min-height:108px;position:relative;overflow:hidden;cursor:pointer}.metric:after{content:"";position:absolute;width:58px;height:58px;border-radius:50%;right:-25px;top:-23px;background:var(--metric-soft,var(--blue-soft))}.metric-top{display:flex;align-items:center;justify-content:space-between}.metric-icon{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--metric-soft,var(--blue-soft));color:var(--metric-color,var(--blue))}.metric-icon svg{width:17px;height:17px}.metric strong{display:block;font-size:27px;line-height:1;margin-top:13px;letter-spacing:-.045em;color:var(--metric-color,var(--blue))}.metric span{display:block;font-size:11px;color:var(--muted);margin-top:6px}.metric.green{--metric-color:var(--green);--metric-soft:var(--green-soft)}.metric.violet{--metric-color:var(--violet);--metric-soft:color-mix(in srgb,var(--violet) 14%,var(--surface))}.metric.amber{--metric-color:var(--amber);--metric-soft:color-mix(in srgb,var(--amber) 14%,var(--surface))}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-card{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:15px;text-align:left;min-height:105px;box-shadow:0 8px 22px rgba(20,66,130,.045);cursor:pointer}.quick-card:active{transform:scale(.985)}.quick-icon{width:38px;height:38px;border-radius:13px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;margin-bottom:11px}.quick-icon svg{width:19px;height:19px}.quick-card b{display:block;font-size:14px}.quick-card small{display:block;color:var(--muted);font-size:11px;margin-top:3px;line-height:1.35}
.ai-promo{margin-top:12px;border:1px solid color-mix(in srgb,var(--blue) 20%,var(--border));background:linear-gradient(135deg,color-mix(in srgb,var(--blue-soft) 65%,var(--surface)),var(--surface));border-radius:22px;padding:16px;display:flex;align-items:center;gap:13px;cursor:pointer}.ai-promo-icon{width:46px;height:46px;border-radius:15px;background:linear-gradient(145deg,var(--blue-2),var(--blue));color:#fff;display:grid;place-items:center;box-shadow:0 9px 20px rgba(22,119,242,.18)}.ai-promo-icon svg{width:23px;height:23px}.ai-promo b{display:block;font-size:14px}.ai-promo small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.ai-promo .arrow{margin-left:auto;color:var(--blue);font-weight:900}

/* Generic controls */
.page-head{display:flex;align-items:center;gap:10px;margin:4px 0 14px}.page-head button{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);display:grid;place-items:center}.page-head h2{font-size:22px;margin:0;letter-spacing:-.025em}.page-head .head-sub{margin-left:auto;color:var(--muted);font-size:11px}
.search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:17px;padding:9px 10px 9px 13px;box-shadow:0 7px 20px rgba(20,66,130,.04)}.search input{border:0;outline:0;background:transparent;flex:1;min-width:0;color:var(--text);padding:4px}.search input::placeholder,.field input::placeholder,.compose textarea::placeholder{color:color-mix(in srgb,var(--muted) 78%,transparent)}.search .search-symbol{display:grid;place-items:center;color:var(--muted)}.search .search-symbol svg{width:18px;height:18px}
.tabs{display:flex;gap:5px;background:var(--surface-3);padding:4px;border-radius:14px;margin:12px 0}.tab{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 8px;font-size:11px;color:var(--muted);font-weight:800}.tab.active{background:var(--surface);color:var(--blue);box-shadow:0 3px 12px rgba(20,66,130,.08)}
.list{display:flex;flex-direction:column;gap:9px}.row-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:13px;display:flex;align-items:center;gap:11px;box-shadow:0 5px 18px rgba(20,66,130,.03);cursor:pointer}.avatar{width:43px;height:43px;border-radius:14px;background:var(--blue-soft);display:grid;place-items:center;color:var(--blue);font-weight:900;flex:0 0 auto}.row-main{flex:1;min-width:0}.row-main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.row-main small{color:var(--muted);display:block;margin-top:3px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:var(--green-soft);color:var(--green);font-size:9px;font-weight:900}.badge.blue{background:var(--blue-soft);color:var(--blue)}.badge.red{background:var(--red-soft);color:var(--red)}
.rooms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.room{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:13px 8px;text-align:center;min-height:88px;cursor:pointer;position:relative}.room b{font-size:20px}.room small{display:block;margin-top:6px;color:var(--muted);font-size:10px}.room .dot{position:absolute;width:7px;height:7px;border-radius:50%;right:10px;top:10px;background:var(--green)}.room.empty .dot{background:#a3afbf}.room.busy{background:color-mix(in srgb,var(--blue-soft) 40%,var(--surface));border-color:color-mix(in srgb,var(--blue) 18%,var(--border))}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px;box-shadow:0 7px 22px rgba(20,66,130,.04)}.kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kv div{padding:10px 0;border-bottom:1px solid var(--border)}.kv small{display:block;color:var(--muted);margin-bottom:4px;font-size:10px}.kv b{font-size:13px}.button-row{display:flex;gap:9px;margin-top:14px}.button-row button{flex:1}
.chart{display:flex;align-items:end;gap:8px;height:148px;padding-top:15px}.bar-wrap{flex:1;text-align:center}.bar{min-height:6px;background:linear-gradient(180deg,var(--cyan),var(--blue));border-radius:9px 9px 4px 4px}.bar-wrap span{font-size:9px;color:var(--muted)}.donut-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini-stat{padding:12px;border-radius:15px;background:var(--surface-2)}.mini-stat b{font-size:20px;color:var(--blue);display:block}.mini-stat small{color:var(--muted);font-size:10px}
.more-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.more-item{background:var(--surface);border:1px solid var(--border);border-radius:19px;padding:15px;cursor:pointer;min-height:105px}.more-item .mi{width:36px;height:36px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;margin-bottom:10px}.more-item .mi svg{width:18px;height:18px}.more-item b{display:block;font-size:13px}.more-item small{color:var(--muted);font-size:10px;display:block;margin-top:3px}.setting-card{margin-bottom:12px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:14px;display:flex;align-items:center;gap:12px}.setting-icon{width:40px;height:40px;border-radius:13px;background:var(--surface-3);display:grid;place-items:center;color:var(--text-2)}.setting-icon svg{width:19px;height:19px}.setting-main{flex:1}.setting-main b{display:block;font-size:13px}.setting-main small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.theme-switch{border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:8px 11px;font-size:10px;font-weight:850;color:var(--blue)}

/* AI */
.ai-head{background:linear-gradient(145deg,color-mix(in srgb,var(--blue-soft) 68%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--blue) 20%,var(--border));border-radius:22px;padding:15px;display:flex;align-items:center;gap:12px;margin-bottom:12px}.ai-head-icon{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--blue-2),var(--blue));color:#fff;display:grid;place-items:center;box-shadow:0 10px 22px rgba(22,119,242,.20)}.ai-head-icon svg{width:22px;height:22px}.ai-head-main{flex:1;min-width:0}.ai-head-main b{display:block;font-size:14px}.ai-head-main small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.ai-status{font-size:9px;font-weight:900;padding:5px 8px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--muted);white-space:nowrap}.ai-status.on{background:var(--green-soft);color:var(--green);border-color:transparent}.prompt-chips{display:flex;gap:7px;overflow-x:auto;padding:1px 1px 10px;scrollbar-width:none}.prompt-chips::-webkit-scrollbar{display:none}.prompt-chip{border:1px solid var(--border);background:var(--surface);color:var(--text-2);border-radius:999px;padding:8px 11px;font-size:10px;white-space:nowrap}.chat{display:flex;flex-direction:column;gap:9px;min-height:43vh;padding:3px 0 6px}.bubble{max-width:88%;padding:12px 14px;border-radius:18px;line-height:1.45;white-space:pre-wrap;font-size:12px;box-shadow:0 5px 18px rgba(20,66,130,.035)}.bubble.bot{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:6px}.bubble.user{background:linear-gradient(135deg,var(--blue-2),var(--blue));color:#fff;align-self:flex-end;border-bottom-right-radius:6px}.bubble.wait{color:var(--muted)}
.chat-compose{position:sticky;bottom:76px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 0%,transparent),var(--bg) 25%);padding-top:14px}.compose{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:7px;box-shadow:var(--shadow)}.compose textarea{resize:none;border:0;outline:0;flex:1;min-height:42px;max-height:116px;padding:10px 8px;background:transparent;color:var(--text)}.send{width:44px;height:44px;border-radius:14px;border:0;background:linear-gradient(145deg,var(--blue-2),var(--blue));color:#fff;display:grid;place-items:center;flex:0 0 auto}.send svg{width:18px;height:18px}.send:disabled{opacity:.55}

/* Bottom nav */
.bottom{position:fixed;z-index:60;bottom:0;left:50%;transform:translateX(-50%);width:min(760px,100%);background:color-mix(in srgb,var(--surface) 93%,transparent);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--border);padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr)}.nav{border:0;background:transparent;color:var(--muted);padding:6px 2px;font-size:9px;font-weight:800;transition:color .15s ease}.nav i{display:grid;place-items:center;height:23px;margin-bottom:2px}.nav i svg{width:21px;height:21px}.nav.active{color:var(--blue)}

/* Modal / form */
.modal{position:fixed;inset:0;background:rgba(7,16,29,.48);z-index:90;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px)}.sheet{width:min(760px,100%);max-height:88vh;overflow:auto;background:var(--surface);border-radius:28px 28px 0 0;padding:20px 17px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -22px 60px rgba(0,0,0,.18)}.sheet-handle{width:42px;height:5px;background:var(--border);border-radius:20px;margin:-6px auto 15px}.sheet h3{margin:0 0 14px;font-size:20px}.field{margin-bottom:11px}.field label{display:block;font-size:10px;color:var(--muted);font-weight:800;margin:0 0 6px 3px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:14px;padding:12px 13px;outline:0;background:var(--surface-2);color:var(--text)}.field input:focus,.field select:focus,.field textarea:focus{border-color:color-mix(in srgb,var(--blue) 55%,var(--border));box-shadow:0 0 0 3px color-mix(in srgb,var(--blue-soft) 75%,transparent)}
.toast{position:fixed;z-index:120;left:50%;bottom:100px;transform:translateX(-50%);background:color-mix(in srgb,var(--text) 92%,transparent);color:var(--bg);border-radius:14px;padding:11px 14px;max-width:88%;font-size:11px;box-shadow:var(--shadow-lg)}
.loading{padding:30px 14px;text-align:center;color:var(--muted);font-size:11px}.empty{padding:30px 14px;text-align:center;color:var(--muted);font-size:12px}.skeleton-list{display:flex;flex-direction:column;gap:9px}.skeleton{height:70px;border-radius:18px;background:linear-gradient(90deg,var(--surface) 25%,var(--surface-3) 50%,var(--surface) 75%);background-size:200% 100%;animation:shimmer 1.1s infinite;border:1px solid var(--border)}@keyframes shimmer{to{background-position:-200% 0}}

@media(min-width:640px){.metrics{grid-template-columns:repeat(4,1fr)}.quick-grid{grid-template-columns:repeat(4,1fr)}.rooms{grid-template-columns:repeat(5,1fr)}}

.hero{background:var(--surface)!important;color:var(--text)!important;border:1px solid var(--border)!important;box-shadow:var(--shadow)!important}.hero:after{display:none!important}.hero p,.hero small{color:var(--muted)!important;opacity:1!important}
</style>
